<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="titleText">Control de Velocidad</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h2 id="speedLabel">Velocidad</h2>
    <select id="speedSelector" aria-label="Selector de velocidad">
      <option value="0.5">0.5x</option>
      <option value="0.75">0.75x</option>
      <option value="1" selected>1x</option>
      <option value="1.25">1.25x</option>
      <option value="1.5">1.5x</option>
      <option value="2">2x</option>
      <option value="custom">Personalizada</option>
    </select>
    <div id="customSpeedContainer" style="display: none;">
      <input type="number" id="customSpeedInput" placeholder="Ej: 1.33" min="0.1" max="10" step="0.01" aria-label="Velocidad personalizada">
      <span class="speed-unit">x</span>
    </div>
    <div id="videosList">
      <p id="loadingText">Cargando videos...</p>
    </div>
    <div class="btn-group">
      <button id="applyBtn" aria-label="Aplicar velocidad">Aplicar</button>
      <button id="resetBtn" type="button" aria-label="Restablecer velocidad">Restablecer</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
